<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A.L.F.R.E.D — Live Demo</title>
  <link rel="icon" type="image/svg+xml" href="../../images/favicon.svg">
  <meta name="description" content="Interactive demo of the A.L.F.R.E.D AI assistant REST API.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg: #0F172A; --surface: #1E293B; --surface-hover: #253349;
      --sky: #0EA5E9; --sky-glow: #38BDF8; --sky-dim: rgba(14,165,233,0.15);
      --green: #22C55E; --red: #EF4444; --amber: #F59E0B;
      --text: #F8FAFC; --text-muted: #94A3B8; --text-dim: #64748B;
      --border: #334155; --border-light: #475569;
    }
    html, body { height: 100%; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 20px;
      border-bottom: 1px solid var(--border);
      background: rgba(15,23,42,0.95);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .header-left { display: flex; align-items: center; gap: 12px; }
    .header-logo {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: var(--sky);
    }
    .header-divider { width: 1px; height: 20px; background: var(--border); }
    .header-label { font-size: 0.78rem; color: var(--text-dim); font-weight: 500; letter-spacing: 1px; text-transform: uppercase; }
    .header-right { display: flex; align-items: center; gap: 16px; }
    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--text-dim);
      flex-shrink: 0;
      transition: background 300ms;
    }
    .status-dot.online { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,0.5); }
    .status-dot.offline { background: var(--red); box-shadow: 0 0 8px rgba(239,68,68,0.5); }
    .status-text { font-size: 0.78rem; color: var(--text-dim); display: flex; align-items: center; gap: 6px; }
    .back-link {
      font-size: 0.8rem; color: var(--text-dim); text-decoration: none;
      display: flex; align-items: center; gap: 4px; transition: color 200ms;
    }
    .back-link:hover { color: var(--sky); }
    .back-link svg { width: 14px; height: 14px; fill: currentColor; }

    /* ── Voice Toggle ──────────────────────── */
    .voice-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.78rem;
      color: var(--text-dim);
      cursor: pointer;
      user-select: none;
      transition: color 200ms;
    }
    .voice-toggle:hover { color: var(--text-muted); }
    .voice-toggle svg { width: 16px; height: 16px; fill: currentColor; }
    .voice-toggle.active { color: var(--sky); }

    /* ── Chat Area ──────────────────────────── */
    .chat-area {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      scroll-behavior: smooth;
    }
    .chat-area::-webkit-scrollbar { width: 4px; }
    .chat-area::-webkit-scrollbar-track { background: transparent; }
    .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .welcome {
      text-align: center;
      padding: 40px 20px;
      max-width: 500px;
      margin: auto;
    }
    .welcome-title {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 2rem;
      letter-spacing: 3px;
      color: var(--text);
      margin-bottom: 8px;
    }
    .welcome-sub { font-size: 0.9rem; color: var(--text-dim); line-height: 1.6; margin-bottom: 24px; }
    .suggestions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .suggestion {
      padding: 8px 16px;
      font-size: 0.8rem;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text-muted);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: all 200ms;
    }
    .suggestion:hover { border-color: var(--sky); color: var(--sky); }

    .msg { display: flex; flex-direction: column; max-width: 720px; width: 100%; animation: fadeUp 300ms ease; }
    .msg.user { align-self: flex-end; align-items: flex-end; }
    .msg.assistant { align-self: flex-start; align-items: flex-start; }
    .msg-label { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 4px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
    .msg-bubble {
      padding: 12px 16px;
      border-radius: 12px;
      font-size: 0.9rem;
      line-height: 1.65;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.user .msg-bubble {
      background: var(--sky-dim);
      border: 1px solid rgba(14,165,233,0.3);
      color: var(--text);
      border-bottom-right-radius: 4px;
    }
    .msg.assistant .msg-bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text-muted);
      border-bottom-left-radius: 4px;
    }
    .msg-time { font-size: 0.65rem; color: var(--text-dim); margin-top: 4px; font-family: 'JetBrains Mono', monospace; }

    .typing { display: flex; gap: 4px; padding: 12px 16px; }
    .typing span {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--text-dim);
      animation: bounce 1.4s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.16s; }
    .typing span:nth-child(3) { animation-delay: 0.32s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0.6); opacity: 0.4; }
      40% { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Input Bar ──────────────────────────── */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: rgba(15,23,42,0.95);
      backdrop-filter: blur(12px);
      flex-shrink: 0;
    }
    .input-row { display: flex; gap: 10px; max-width: 760px; margin: 0 auto; }
    .input-field {
      flex: 1;
      padding: 12px 16px;
      font-size: 0.9rem;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      transition: border-color 200ms;
    }
    .input-field::placeholder { color: var(--text-dim); }
    .input-field:focus { border-color: var(--sky); }

    .icon-btn {
      width: 44px; height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: all 200ms;
      flex-shrink: 0;
    }
    .icon-btn svg { width: 18px; height: 18px; fill: var(--text-muted); transition: fill 200ms; }
    .icon-btn:hover { border-color: var(--sky); }
    .icon-btn:hover svg { fill: var(--sky); }
    .icon-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .icon-btn.listening {
      border-color: var(--red);
      background: rgba(239,68,68,0.1);
      animation: pulse 1.5s infinite;
    }
    .icon-btn.listening svg { fill: var(--red); }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(239,68,68,0.3); }
      50% { box-shadow: 0 0 0 8px rgba(239,68,68,0); }
    }

    .send-btn {
      padding: 12px 20px;
      font-size: 0.85rem;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      color: var(--bg);
      background: var(--sky);
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: all 200ms;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .send-btn:hover:not(:disabled) { background: var(--sky-glow); box-shadow: 0 0 20px rgba(14,165,233,0.3); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .send-btn svg { width: 16px; height: 16px; fill: currentColor; }
    .input-hint {
      text-align: center;
      font-size: 0.7rem;
      color: var(--text-dim);
      margin-top: 8px;
      max-width: 760px;
      margin-left: auto;
      margin-right: auto;
    }
    .input-hint a { color: var(--sky); text-decoration: none; }
    .input-hint a:hover { text-decoration: underline; }

    /* ── Responsive ─────────────────────────── */
    @media (max-width: 600px) {
      .header { padding: 10px 14px; }
      .header-label { display: none; }
      .header-divider { display: none; }
      .chat-area { padding: 16px 14px; }
      .input-area { padding: 12px 14px; }
      .welcome { padding: 24px 12px; }
      .welcome-title { font-size: 1.6rem; }
      .send-btn span { display: none; }
      .send-btn { padding: 12px 14px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-left">
      <div class="header-logo">A.L.F.R.E.D</div>
      <div class="header-divider"></div>
      <div class="header-label">Live Demo</div>
    </div>
    <div class="header-right">
      <div class="voice-toggle active" id="voiceToggle" onclick="toggleVoice()" title="Toggle voice responses">
        <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/></svg>
      </div>
      <div class="status-text">
        <span class="status-dot" id="statusDot"></span>
        <span id="statusLabel">Connecting...</span>
      </div>
      <a href="../alfred.html" class="back-link">
        <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
        Details
      </a>
    </div>
  </div>

  <div class="chat-area" id="chatArea">
    <div class="welcome" id="welcome">
      <div class="welcome-title">Talk to A.L.F.R.E.D</div>
      <p class="welcome-sub">This is a live demo connected to the deployed FastAPI backend. Type a message or click the microphone to speak &mdash; A.L.F.R.E.D will respond with text and voice.</p>
      <div class="suggestions">
        <button class="suggestion" onclick="sendSuggestion(this)">What can you do?</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Tell me a fun fact</button>
        <button class="suggestion" onclick="sendSuggestion(this)">What time is it?</button>
        <button class="suggestion" onclick="sendSuggestion(this)">Who created you?</button>
      </div>
    </div>
  </div>

  <div class="input-area">
    <div class="input-row">
      <input type="text" class="input-field" id="msgInput" placeholder="Type a message or click the mic..." autocomplete="off" autofocus>
      <button class="icon-btn" id="micBtn" onclick="toggleMic()" title="Hold to speak">
        <svg viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm-1-9c0-.55.45-1 1-1s1 .45 1 1v6c0 .55-.45 1-1 1s-1-.45-1-1V5zm6 6c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
      </button>
      <button class="send-btn" id="sendBtn" onclick="send()">
        <span>Send</span>
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
    </div>
    <div class="input-hint">Powered by <a href="https://alfred-production-5c1f.up.railway.app/docs" target="_blank">A.L.F.R.E.D API</a> &middot; FastAPI + Supabase + RAG</div>
  </div>

  <script>
    const API = 'https://alfred-production-5c1f.up.railway.app';
    const chatArea = document.getElementById('chatArea');
    const msgInput = document.getElementById('msgInput');
    const sendBtn  = document.getElementById('sendBtn');
    const micBtn   = document.getElementById('micBtn');
    const statusDot = document.getElementById('statusDot');
    const statusLabel = document.getElementById('statusLabel');
    const voiceToggle = document.getElementById('voiceToggle');
    const welcome = document.getElementById('welcome');
    let sending = false;
    let voiceEnabled = true;
    let listening = false;
    let recognition = null;

    // ── Speech Recognition (STT) ──────────────────────────────────────────────

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = false;
      recognition.interimResults = false;
      recognition.lang = 'en-US';

      recognition.onresult = (e) => {
        const transcript = e.results[0][0].transcript;
        msgInput.value = transcript;
        stopListening();
        send();
      };

      recognition.onerror = (e) => {
        console.warn('Speech recognition error:', e.error);
        stopListening();
      };

      recognition.onend = () => {
        stopListening();
      };
    } else {
      micBtn.style.display = 'none';
    }

    function toggleMic() {
      if (!recognition) return;
      if (listening) {
        recognition.abort();
        stopListening();
      } else {
        startListening();
      }
    }

    function startListening() {
      if (!recognition || sending) return;
      listening = true;
      micBtn.classList.add('listening');
      msgInput.placeholder = 'Listening...';
      try {
        recognition.start();
      } catch (e) {
        stopListening();
      }
    }

    function stopListening() {
      listening = false;
      micBtn.classList.remove('listening');
      msgInput.placeholder = 'Type a message or click the mic...';
    }

    // ── Speech Synthesis (TTS) ────────────────────────────────────────────────

    const synth = window.speechSynthesis;

    function cleanForSpeech(text) {
      // Remove emojis
      text = text.replace(/[\u{1F000}-\u{1FFFF}|\u{2600}-\u{27BF}|\u{FE00}-\u{FEFF}|\u{1F900}-\u{1F9FF}|\u{200D}|\u{20E3}|\u{E0020}-\u{E007F}]/gu, '');
      // Pronounce acronyms naturally
      text = text.replace(/A\.L\.F\.R\.E\.D\.?/gi, 'Alfred');
      text = text.replace(/J\.A\.R\.V\.I\.S\.?/gi, 'Jarvis');
      // Remove special characters (keep letters, numbers, basic punctuation, spaces)
      text = text.replace(/[*#_~`|<>{}[\]^\\]/g, '');
      // Clean up extra whitespace
      text = text.replace(/\s{2,}/g, ' ');
      return text.trim();
    }

    function speak(text) {
      if (!voiceEnabled || !synth) return;
      synth.cancel();
      const utterance = new SpeechSynthesisUtterance(cleanForSpeech(text));
      utterance.rate = 1.0;
      utterance.pitch = 1.0;

      // Prefer a male English voice
      const voices = synth.getVoices();
      const preferred = voices.find(v =>
        v.lang.startsWith('en') && v.name.toLowerCase().includes('male')
      ) || voices.find(v =>
        v.lang.startsWith('en') && (v.name.includes('Daniel') || v.name.includes('James') || v.name.includes('Google UK English Male'))
      ) || voices.find(v => v.lang.startsWith('en'));

      if (preferred) utterance.voice = preferred;
      synth.speak(utterance);
    }

    // Voices load async in some browsers
    if (synth) synth.onvoiceschanged = () => {};

    // Mobile browsers require a user gesture to unlock speech synthesis
    let ttsUnlocked = false;
    function unlockTTS() {
      if (ttsUnlocked || !synth) return;
      const silence = new SpeechSynthesisUtterance('');
      silence.volume = 0;
      synth.speak(silence);
      ttsUnlocked = true;
    }
    document.addEventListener('click', unlockTTS, { once: true });
    document.addEventListener('touchstart', unlockTTS, { once: true });

    function toggleVoice() {
      voiceEnabled = !voiceEnabled;
      voiceToggle.classList.toggle('active', voiceEnabled);
      voiceToggle.title = voiceEnabled ? 'Voice on (click to mute)' : 'Voice off (click to unmute)';
      if (!voiceEnabled && synth) synth.cancel();
    }

    // ── Health Check ──────────────────────────────────────────────────────────

    async function checkHealth() {
      try {
        const r = await fetch(`${API}/system/health`);
        const d = await r.json();
        statusDot.className = 'status-dot ' + (d.status === 'healthy' ? 'online' : 'offline');
        statusLabel.textContent = d.status === 'healthy' ? 'Online' : 'Degraded';
      } catch {
        statusDot.className = 'status-dot offline';
        statusLabel.textContent = 'Offline';
      }
    }
    checkHealth();
    setInterval(checkHealth, 30000);

    // ── Chat ──────────────────────────────────────────────────────────────────

    function timeStr() {
      return new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function addMsg(role, text) {
      if (welcome) welcome.style.display = 'none';
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      const content = role === 'assistant' ? renderMarkdown(text) : escapeHtml(text);
      div.innerHTML = `
        <div class="msg-label">${role === 'user' ? 'You' : 'A.L.F.R.E.D'}</div>
        <div class="msg-bubble">${content}</div>
        <div class="msg-time">${timeStr()}</div>
      `;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
      return div;
    }

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'msg assistant';
      div.id = 'typing';
      div.innerHTML = `
        <div class="msg-label">A.L.F.R.E.D</div>
        <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>
      `;
      chatArea.appendChild(div);
      chatArea.scrollTop = chatArea.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing');
      if (el) el.remove();
    }

    function escapeHtml(s) {
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function renderMarkdown(text) {
      let html = escapeHtml(text);
      // Bold: **text** or __text__
      html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
      html = html.replace(/__(.+?)__/g, '<strong>$1</strong>');
      // Italic: *text* or _text_
      html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
      html = html.replace(/(?<!\w)_(.+?)_(?!\w)/g, '<em>$1</em>');
      // Inline code: `text`
      html = html.replace(/`(.+?)`/g, '<code style="background:rgba(14,165,233,0.15);padding:1px 5px;border-radius:4px;font-size:0.85em">$1</code>');
      // Line breaks
      html = html.replace(/\n/g, '<br>');
      return html;
    }

    async function send() {
      const text = msgInput.value.trim();
      if (!text || sending) return;

      sending = true;
      sendBtn.disabled = true;
      micBtn.disabled = true;
      msgInput.value = '';
      addMsg('user', text);
      showTyping();

      try {
        const r = await fetch(`${API}/chat`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        const d = await r.json();
        removeTyping();
        addMsg('assistant', d.response);
        speak(d.response);
      } catch (e) {
        removeTyping();
        addMsg('assistant', 'Sorry, I could not reach the server. Please try again later.');
      }

      sending = false;
      sendBtn.disabled = false;
      micBtn.disabled = false;
      msgInput.focus();
    }

    function sendSuggestion(btn) {
      msgInput.value = btn.textContent;
      send();
    }

    msgInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
  </script>
</body>
</html>
