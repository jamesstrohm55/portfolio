<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 — Page Not Found | James Strohm</title>
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Space Grotesk', sans-serif;
      background: #0F172A;
      color: #F8FAFC;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .code {
      font-family: 'Bebas Neue', sans-serif;
      font-size: clamp(6rem, 20vw, 10rem);
      letter-spacing: 8px;
      background: linear-gradient(135deg, #0EA5E9, #0369A1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
    }
    p { color: #94A3B8; font-size: 1.1rem; margin: 16px 0 32px; }
    a {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 28px;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Space Grotesk', sans-serif;
      border-radius: 8px;
      text-decoration: none;
      background: #0EA5E9;
      color: #0F172A;
      transition: background 200ms, box-shadow 200ms;
    }
    a:hover {
      background: #38BDF8;
      box-shadow: 0 0 24px rgba(14, 165, 233, 0.3);
    }
  </style>
</head>
<body>
  <div>
    <div class="code">404</div>
    <p>This page doesn't exist. Let's get you back on track.</p>
    <a href="/">Back to Home</a>
  </div>
</body>
</html>
